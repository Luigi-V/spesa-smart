<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Reset Spesa Smart</title>
<style>
  body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;
    display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
  .box{max-width:420px;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;text-align:center}
  h1{margin:0 0 12px;font-size:1.25rem;color:#10b981}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 18px;border-radius:10px;
    background:#10b981;color:#04130e;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main class="box">
  <h1>Reset dell'app</h1>
  <p id="msg">Pulizia in corso…</p>
  <a id="open" class="btn" href="./" hidden>Apri l'app</a>
</main>
<script>
(async function () {
  var msg = document.getElementById('msg');
  var open = document.getElementById('open');
  try {
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function (r) { return r.unregister(); }));
    }
    if (window.caches) {
      var keys = await caches.keys();
      await Promise.all(keys.map(function (k) { return caches.delete(k); }));
    }
    msg.textContent = 'Reset completato. I tuoi dati sono rimasti sul telefono.';
  } catch (e) {
    console.error(e);
    msg.textContent = 'Reset non completato. Riprova.';
  }
  open.hidden = false;
})();
</script>
</body>
</html>
